# tack pins
# edit by hand or with tack add / rm / alias
# nix reads pins.lock.json
# this file drives tack update

# shorturl schemes
# scheme rest expands rest into {path}
[shorturls]
# gh = "github:{path}"

# all_follow maps input names to the top-level pin they follow
# opt out per-input with exclude_follow
[all_follow]
nixpkgs = "nixpkgs"
systems = "systems"
flake-parts = "flake-parts"

# inputs.<name> fields
#   url             required, shorturl ok, ?rev=<sha> pins an exact commit
#   type            flake (default), fetch, or fixed
#   flake           legacy false means type = "fetch"
#   follows         { child = "pin" } override map
#   exclude_follow  all_follow names to skip
#   dir             subdir holding flake.nix
#   submodules      fetch git submodules
#   unpack          fixed-only tarball or file

# channel urls are faster and more reliable than github -.-
[inputs.nixpkgs]
url = "https://channels.nixos.org/nixos-unstable/nixexprs.tar.zst"
patches = [
    # always allow unfree, i dgaf
    "patches/nixpkgs/allow-unfree.patch",

    # nixos/noctalia-greeter: support autologin
    "https://github.com/NixOS/nixpkgs/pull/560780",

    # awakened-poe-trade: add commandLineArgs
    "https://github.com/NixOS/nixpkgs/pull/496108",
]

[inputs.nixpkgs-stable]
url = "https://channels.nixos.org/nixos-26.05/nixexprs.tar.zst"

[inputs.multiverse]
url = "github:fzakaria/nixpkgs-multiverse"

[inputs.systems]
url = "github:nix-systems/default"

[inputs.hjem]
url = "github:feel-co/hjem"

[inputs.wrappers]
url = "github:BirdeeHub/nix-wrapper-modules"
patches = [
    # expose options used to build each wrapped package
    "patches/wrappers/nix-wrappers-expose-options.patch",

    # noctalia module
    # https://github.com/BirdeeHub/nix-wrapper-modules/pull/598 (local patch due to merge conflict in maintainers.nix)
    "patches/wrappers/noctalia-module.patch",

    # feat(wrapperModules.yazi): support init.lua
    "https://github.com/nix-community/nix-wrapper-modules/pull/586",
]

[inputs.nixos-hardware]
url = "github:NixOS/nixos-hardware"

[inputs.preservation]
url = "github:nix-community/preservation"

[inputs.sops-nix]
url = "github:Mic92/sops-nix"

[inputs.nix-index-database]
url = "github:nix-community/nix-index-database"

[inputs.nvf]
url = "github:notashelf/nvf"

[inputs.tack]
url = "github:manic-systems/tack"

[inputs.focal]
url = "github:iynaix/focal"

[inputs.wfetch]
url = "github:iynaix/wfetch"

[inputs.umbriel]
url = "github:noctalia-dev/umbriel"
submodules = true

[inputs.lamina]
url = "github:iynaix/lamina"

[inputs.rusty-path-of-building]
url = "github:meehl/rusty-path-of-building"
type = "fetch"
group = "source"

[inputs.yt-dlp]
url = "github:yt-dlp/yt-dlp"
type = "fetch"
group = "source"

[inputs.awakened-poe-trade]
url = "https://github.com/SnosMe/awakened-poe-trade/releases/download/v{version}/Awakened-PoE-Trade-{version}.AppImage"
type = "fixed"
tag = "v{version}"
group = "binary"

[inputs.exiled-exchange-2]
url = "https://github.com/Kvan7/Exiled-Exchange-2/releases/download/v{version}/Exiled-Exchange-2-{version}.AppImage"
type = "fixed"
tag = "v{version}"
group = "binary"

[inputs.helium]
url = "https://github.com/imputnet/helium-linux/releases/download/{version}/helium-{version}-x86_64.AppImage"
type = "fixed"
tag = "{version}"
group = "binary"
